<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skechzz - Day 2 Broken Pencil</title>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #0A0A0A;
            --white: #F5F5F5;
            --gray: #2C2C2C;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--black);
            color: var(--white);
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .canvas {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px; 
            max-height: 888px;
            overflow: hidden;
            background: #fff;
        }

        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .drawing-scene {
            opacity: 1;
            background: #fdfdfd;
            animation: fadeOut 0.5s ease forwards 4.5s;
        }
        .pencil-container {
            position: relative;
            width: 100px;
            height: 400px;
            transform: rotate(-30deg) translate(50px, -100px);
            animation: pencilWrite 2s ease-in-out forwards, pencilBreak 0.5s ease-in 2.5s forwards;
        }
        .pencil-body {
            width: 40px;
            height: 300px;
            background: #e6b422;
            border-radius: 5px 5px 0 0;
            position: relative;
        }
        .pencil-wood {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 60px solid #d2b48c;
            position: absolute;
            bottom: -60px;
            left: 0;
        }
        .pencil-tip {
            width: 10px;
            height: 15px;
            background: #333;
            position: absolute;
            bottom: -75px;
            left: 5px;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .line {
            position: absolute;
            width: 2px;
            background: #333;
            bottom: 40%;
            left: 50%;
            height: 0;
            transform: rotate(60deg);
            animation: drawLine 2s ease-out forwards;
        }

        .text-scene {
            z-index: 10;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            animation: fadeIn 0.5s ease forwards 3s, fadeOut 0.5s ease forwards 5.5s;
        }
        .shake-text {
            font-size: 32px;
            text-align: center;
            padding: 20px;
            animation: shake 0.2s infinite;
            color: #ff4444;
        }

        .reveal-scene {
            background: var(--black);
            animation: fadeIn 1s ease forwards 5.5s;
        }
        .asset-container {
            width: 100%;
            height: 100%;
            background-image: url('https://storage.googleapis.com/interaction-media-bucket/47f84109-d17a-4375-8fc8-f55e778ed5d8/5fb0cc73-8d4f-5749-bfab-70c1be3936bf?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=vercel%40theta-eon-430220-u6.iam.gserviceaccount.com%2F20260610%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260610T141400Z&X-Goog-Expires=60&X-Goog-SignedHeaders=host&X-Goog-Signature=97e702cc6c2c920f4ecea71e3e6b90ee639f0d97c65ec6ee50d33d124d447ba1655e908cba5b32bfa4586db6b00623e9216631d4d5ffcd0ed960cb4782ab1df294483b446ebd660461602c343eb44f4a13033d7cfc89dd5475135f444da792448b9a62b33c9917dac26784e6d3c094ccf0e5b060417f4bf40b92316568b42b5c46807b32cf3600c8b426d443390d7c292eebb250d3738b8f4338dca450b1982ca2f7f58a1d58b67cf2a4b5f0b8bc6bec68c28dddc97bae5fcb49ad258698b57defa6d6b9717eca1387289eca1e7509c5e5887d132d1e3fd6c18b72a2b80db2f5bae52c211a1fdce70251a7fe1d76a1a2acc5b284beb266e89fa05617d071c7bd');
            background-size: cover;
            background-position: center;
            animation: cinematicPan 10s linear infinite alternate;
        }
        .reveal-overlay {
            position: absolute;
            bottom: 20%;
            width: 100%;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 20px 0;
        }
        .reveal-text {
            font-size: 28px;
            color: var(--white);
            animation: fadeInUp 1s ease forwards 6.5s;
            opacity: 0;
        }

        .cta-container {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 8s;
        }
        .cta-btn {
            display: inline-block;
            padding: 15px 40px;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 700;
            font-size: 14px;
        }

        @keyframes pencilWrite {
            0% { transform: rotate(-30deg) translate(200px, -200px); }
            100% { transform: rotate(-30deg) translate(50px, -100px); }
        }
        @keyframes drawLine {
            0% { height: 0; }
            100% { height: 200px; }
        }
        @keyframes pencilBreak {
            0% { transform: rotate(-30deg) translate(50px, -100px); }
            50% { transform: rotate(-35deg) translate(45px, -105px); }
            100% { transform: rotate(-30deg) translate(50px, -100px); }
        }
        #tip { animation: tipSnap 1s ease-in forwards 2.5s; }
        @keyframes tipSnap {
            0% { transform: translateY(0); }
            20% { transform: translateY(-5px) rotate(10deg); }
            100% { transform: translateY(500px) rotate(180deg); opacity: 0; }
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-1deg); }
            50% { transform: translate(-3px, 0px) rotate(1deg); }
            75% { transform: translate(3px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }
        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes cinematicPan {
            from { background-position: 40% 50%; }
            to { background-position: 60% 50%; }
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="canvas">
        <div class="scene drawing-scene">
            <div class="line"></div>
            <div class="pencil-container">
                <div class="pencil-body">
                    <div class="pencil-wood"></div>
                    <div id="tip" class="pencil-tip"></div>
                </div>
            </div>
        </div>

        <div class="scene text-scene">
            <div class="shake-text">pehla akshar likhne se pehle hi toot gai...</div>
        </div>

        <div class="scene reveal-scene">
            <div class="asset-container"></div>
            <div class="reveal-overlay">
                <div class="reveal-text">par maine toh isse yeh bana diya</div>
            </div>
            
            <div class="cta-container">
                <div class="cta-btn">DM to order now</div>
            </div>
        </div>
    </div>
</body>
</html>
